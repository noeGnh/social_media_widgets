name: social_media_widgets
description: A new flutter package for collection of common popular social media widgets like instagram story swipe and snapchat screen dismiss
version: 1.0.0+4
homepage: https://github.com/GursheeshSingh/social_media_widgets

environment:
  sdk: '>=2.12.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
